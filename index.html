<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ໄປກິນເຂົ້ານຳກັນບໍ່? 🥺</title>

  <!-- Fonts with Lao + Thai glyph support -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* ---------- Base / theme ---------- */
    :root {
      --bg: #ffe6e8;
      --card: #ffffff;
      --text: #5a2a3a;
      --yes: #ff3d6e;
      --yes-hover: #e8235a;
      --no: #f1d5db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans Lao", "Noto Sans Thai", system-ui, sans-serif;
      overflow: hidden;
    }

    /* ---------- Card ---------- */
    .card {
      position: relative;            /* the No button is positioned inside this box */
      width: min(440px, 100%);
      min-height: 460px;
      padding: 32px 24px;
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(255, 61, 110, 0.18), 0 2px 6px rgba(0, 0, 0, 0.05);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      animation: pop-in 0.5s ease-out;
    }

    /* ---------- GIF slot ---------- */
    .gif {
      width: 180px;
      height: 180px;
      border-radius: 16px;
      object-fit: cover;
    }
    /* Emoji fallback shown when no GIF URL is set (or it fails to load) */
    .gif-fallback {
      font-size: 110px;
      line-height: 180px;
      height: 180px;
      animation: bounce 1.4s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2rem);
      line-height: 1.4;
    }

    .subtext {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.6;
      opacity: 0.85;
    }

    /* ---------- Buttons ---------- */
    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 12px 28px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-yes {
      background: var(--yes);
      color: #fff;
      box-shadow: 0 6px 16px rgba(255, 61, 110, 0.4);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .btn-yes:hover,
    .btn-yes:focus-visible {
      transform: scale(1.12);
      background: var(--yes-hover);
    }

    .btn-no {
      background: var(--no);
      color: var(--text);
      /* smooth "bounce away" when its position changes */
      transition: left 0.35s cubic-bezier(.34, 1.56, .64, 1), top 0.35s cubic-bezier(.34, 1.56, .64, 1);
      z-index: 2;
    }
    /* Once it starts running, it's absolutely positioned within the card */
    .btn-no.evasive { position: absolute; }

    /* ---------- Celebration hearts ---------- */
    .heart {
      position: fixed;
      bottom: -40px;
      pointer-events: none;
      animation: float-up linear forwards;
    }

    /* ---------- Animations ---------- */
    @keyframes pop-in {
      from { transform: scale(0.85); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }
    @keyframes float-up {
      to { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card" id="card">
    <!-- GIF placeholder: set ASK_GIF below to your own GIF URL -->
    <div id="ask-gif"></div>

    <h1 id="headline">ໄປກິນເຂົ້ານຳກັນບໍ່? 🥺</h1>

    <div class="buttons">
      <button class="btn-yes" id="yes">ໄປ ❤️</button>
      <button class="btn-no" id="no">ບໍ່ໄປ 😢</button>
    </div>
  </main>

  <script>
    /* ======================================================
       Editable settings
       ====================================================== */
    // Paste GIF URLs here (e.g. from Tenor/Giphy). Leave empty to use the emoji.
    const ASK_GIF = "";
    const YES_GIF = "";
    const ASK_EMOJI = "🐻";
    const YES_EMOJI = "🥰";

    const SUCCESS_TITLE = "ເຍ້! ນັດແລ້ວປະຕິເສດບໍ່ໄດ້ເດີ້ 🎉❤️";
    const SUCCESS_TEXT = "ລ້ຽງພ້ອມເດີ້ ເດີ້ ຂອບໃຈ 💕 ";

    // Messages the No button cycles through each time it runs away
    const NO_MESSAGES = [
      "ແນ່ໃຈຫວາ? 🥺",
      "ໃຫ້ຄິດອີກເທື່ອໜື່ງ",
      "ຍ່າໃຈດຳຫຼາຍ 💔",
      "ກົດຜິດປຸ່ມແລ້ວ!",
      "ກົດໄປນຳກັນດຽວນີ້ 💕😘",
    ];

    /* ======================================================
       Helpers
       ====================================================== */
    const card = document.getElementById("card");
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");

    // Render a GIF, falling back to a bouncing emoji if no URL / load error
    function renderGif(container, url, emoji) {
      const fallback = `<div class="gif-fallback" aria-hidden="true">${emoji}</div>`;
      if (!url) { container.innerHTML = fallback; return; }
      const img = new Image();
      img.className = "gif";
      img.alt = "";
      img.src = url;
      img.onerror = () => { container.innerHTML = fallback; };
      container.replaceChildren(img);
    }

    renderGif(document.getElementById("ask-gif"), ASK_GIF, ASK_EMOJI);

    /* ======================================================
       Evasive "No" button
       ====================================================== */
    let msgIndex = 0;

    function overlaps(a, b) {
      return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
    }

    function runAway() {
      // Change the text first so we measure the new width
      noBtn.textContent = NO_MESSAGES[msgIndex];
      msgIndex = (msgIndex + 1) % NO_MESSAGES.length;
      noBtn.classList.add("evasive");

      const pad = 8;
      const maxX = card.clientWidth - noBtn.offsetWidth - pad;
      const maxY = card.clientHeight - noBtn.offsetHeight - pad;
      const cardRect = card.getBoundingClientRect();
      const yesRect = yesBtn.getBoundingClientRect();
      const cur = noBtn.getBoundingClientRect();

      // Try a few random spots; avoid covering the Yes button and staying under the pointer
      let x, y;
      for (let i = 0; i < 30; i++) {
        x = pad + Math.random() * Math.max(0, maxX - pad);
        y = pad + Math.random() * Math.max(0, maxY - pad);
        const r = {
          left: cardRect.left + x, top: cardRect.top + y,
          right: cardRect.left + x + noBtn.offsetWidth, bottom: cardRect.top + y + noBtn.offsetHeight,
        };
        if (!overlaps(r, yesRect) && !overlaps(r, cur)) break;
      }

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    // Desktop: dodge on hover
    noBtn.addEventListener("mouseenter", runAway);
    // Mobile: dodge on touch (preventDefault stops the tap becoming a click)
    noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); runAway(); }, { passive: false });
    // Keyboard / any click that gets through: still dodge, never "accept" No
    noBtn.addEventListener("click", (e) => { e.preventDefault(); runAway(); });

    /* ======================================================
       "Yes" → celebration
       ====================================================== */
    function spawnHearts(count = 30) {
      const emojis = ["❤️", "💕", "💖", "💗", "🎉", "✨"];
      for (let i = 0; i < count; i++) {
        const h = document.createElement("span");
        h.className = "heart";
        h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        h.style.left = `${Math.random() * 100}vw`;
        h.style.fontSize = `${18 + Math.random() * 24}px`;
        h.style.animationDuration = `${3 + Math.random() * 3}s`;
        h.style.animationDelay = `${Math.random() * 1.5}s`;
        h.addEventListener("animationend", () => h.remove());
        document.body.appendChild(h);
      }
    }

    yesBtn.addEventListener("click", () => {
      card.innerHTML = `
        <div id="yes-gif"></div>
        <h1 lang="th"></h1>
        <p class="subtext"></p>
      `;
      // textContent keeps the editable strings safe from HTML injection
      card.querySelector("h1").textContent = SUCCESS_TITLE;
      card.querySelector(".subtext").textContent = SUCCESS_TEXT;
      renderGif(document.getElementById("yes-gif"), YES_GIF, YES_EMOJI);

      // Replay the pop-in animation
      card.style.animation = "none";
      card.offsetHeight;
      card.style.animation = "";

      spawnHearts();
    });
  </script>
</body>
</html>
